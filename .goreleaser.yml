version: 2

project_name: protoc-go

builds:
  - id: protoc-go
    main: ./cmd/protoc-go
    binary: protoc-go
    # Pure Go, so one ubuntu runner cross-compiles every target. -trimpath keeps
    # the build machine's paths out of the binary.
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # The module version goes into its own variable, read back by
      # --protoc_go_version. It must never reach --version, which stays
      # byte-identical to C++ protoc's output. See compiler/cli/cli.go.
      - -s -w -X github.com/wham/protoc-go/compiler/cli.moduleVersion={{ .Tag }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "protoc-go_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github

release:
  # Generated by scripts/release-notes from the compliance run that gated this
  # tag, and exported by release.yml. GoReleaser fails on an unset variable,
  # which is the behaviour we want: no release should describe itself as
  # verified without the summary that proves it.
  header: |
    {{ .Env.RELEASE_HEADER }}
