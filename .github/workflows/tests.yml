name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets compliance.yml get a `test` check onto the results branch it pushes.
  # Workflows cannot be woken by anything GITHUB_TOKEN does except a dispatch,
  # so the compliance run asks for this one by name.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"

      # The version is read from the binary (`protoc-go --version`) rather than
      # pinned here, so bumping the target in one place cannot leave the gate
      # comparing against the release protoc-go no longer claims to mirror.
      - name: Install target protoc
        run: .github/install-target-protoc.sh

      - name: Run tests
        run: scripts/test --summary

  benchmarks:
    runs-on: ubuntu-latest
    # Informational only — perf is environment-sensitive and must never block a
    # merge. Kept separate from the correctness gate above.
    continue-on-error: true
    permissions:
      contents: read
      # For the sticky results comment below.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"

      - name: Install target protoc
        run: .github/install-target-protoc.sh

      - name: CLI benchmark (C++ protoc vs Go protoc-go)
        run: scripts/bench --summary --sizes "tiny small medium"

      - name: In-process library benchmark
        run: |
          go build -o tools/protoc-gen-dump/protoc-gen-dump ./tools/protoc-gen-dump/
          go test ./protoc/ -run='^$' -bench='BenchmarkCompile|BenchmarkPluginDispatch' \
            -benchtime=5x -benchmem | tee results-bench/go-bench.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: results-bench/

      - name: Post results to the pull request
        # One sticky comment per pull request, found by its marker and updated
        # in place on every push, so the numbers are always the current head's
        # rather than a pile of stale comments. Runs only for pull_request
        # events; on a fork's pull request the token cannot write comments and
        # the step simply fails inside an already-informational job.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- bench-results -->'
          body=$(mktemp)
          {
            echo "$marker"
            cat results-bench/bench.md
          } > "$body"

          comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -F body=@"$body" >/dev/null
            echo "updated comment ${comment_id}"
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
              -F body=@"$body" >/dev/null
            echo "created comment"
          fi
