name: Compliance

# Weekly proof that the Go compiler still matches the C++ one, published to the
# README. Kept separate from tests.yml: that workflow gates merges, this one
# publishes evidence and must never be able to make a PR look red.
#
# Results are published as a pull request rather than a push to main, because
# main's ruleset requires the `test` status check and a direct push can never
# carry one.

on:
  schedule:
    # Mondays, 06:17 UTC. Off the hour on purpose — scheduled runs at :00 queue
    # behind everyone else's cron.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      publish:
        description: "Open a pull request with the results"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  # Lets the Publish results step ask tests.yml to run against the results
  # branch. See that step for why the run has to be requested by hand.
  actions: write

concurrency:
  group: compliance
  cancel-in-progress: false

jobs:
  # Verifies against the exact C++ release protoc-go claims to mirror, and
  # publishes that result. The target is read from the binary itself
  # (`protoc-go --version`) rather than pinned here, so there is one source of
  # truth and CI cannot drift from what the compiler advertises.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN is enough; COMPLIANCE_TOKEN is honoured if set, which
          # saves the explicit tests.yml dispatch in the Publish results step.
          token: ${{ secrets.COMPLIANCE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      # Shared with tests.yml so the gate and the published claim can never
      # disagree about which C++ release they verified against.
      - name: Install target protoc
        run: .github/install-target-protoc.sh

      - name: Install hyperfine
        # Without it scripts/bench falls back to a ~1ms timer whose numbers
        # cannot resolve the sub-30ms cases. Non-fatal: the harness marks the
        # results unreliable and the renderer publishes them without verdicts.
        continue-on-error: true
        run: |
          curl -fsSL "https://github.com/sharkdp/hyperfine/releases/download/v1.19.0/hyperfine_1.19.0_amd64.deb" -o /tmp/hyperfine.deb
          sudo dpkg -i /tmp/hyperfine.deb

      - name: Correctness — Go protoc-go vs C++ protoc
        run: scripts/test --summary --json results/summary.json

      - name: Performance — Go protoc-go vs C++ protoc
        # Perf is environment-sensitive and never blocks publishing; if this
        # step fails there is simply no bench section in the README.
        continue-on-error: true
        run: scripts/bench --summary --sizes "tiny small medium large"

      - name: Render README
        run: |
          scripts/render-readme \
            --summary results/summary.json \
            --bench results-bench/bench.json \
            --badge docs/badge.json \
            --history docs/history.jsonl

      - name: Upload raw results
        uses: actions/upload-artifact@v4
        with:
          name: compliance-results
          path: |
            results/summary.json
            results-bench/bench.json
            results-bench/bench.md
          retention-days: 90

      # Published as a pull request, not a push: main requires the `test` status
      # check, and a direct push carries no check to satisfy it.
      #
      # Opening that pull request needs "Allow GitHub Actions to create and
      # approve pull requests" (Settings → Actions → General); without it the
      # create call is rejected outright and the results never leave the branch.
      #
      # GITHUB_TOKEN then opens the pull request but cannot start CI on it: no
      # workflow run is created for events that token causes, so neither the
      # push nor the pull request wakes tests.yml and the `test` check stays
      # unreported. workflow_dispatch is the documented exception, so the run is
      # requested explicitly below. A COMPLIANCE_TOKEN secret (fine-grained PAT
      # or GitHub App token, contents + pull-requests write) skips all of this —
      # its pull request arrives with CI already running.
      - name: Publish results
        if: github.event_name == 'schedule' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.COMPLIANCE_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: compliance/results
        run: |
          # The renderer only rewrites the marked region and the docs/ outputs;
          # a tracked file changing anywhere else means something went wrong,
          # so bail out rather than committing it.
          unexpected=$(git diff --name-only -- . ':!README.md' ':!docs/badge.json' ':!docs/history.jsonl')
          if [ -n "$unexpected" ]; then
            echo "unexpected changes, refusing to commit:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

          if [ -z "$(git status --porcelain -- README.md docs/)" ]; then
            echo "results unchanged, nothing to publish"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"
          git add README.md docs/badge.json docs/history.jsonl
          # No [skip ci] here, unlike the old direct push: the pull request needs
          # tests.yml to run before it can be merged.
          git commit -m "Published weekly compliance results"

          # The branch is disposable — recreated from the current base every run
          # and only ever carrying the newest results — so a force push is the
          # intended update rather than lost history.
          for attempt in 1 2 3 4; do
            git push --force origin "HEAD:refs/heads/${BRANCH}" && break
            if [ "${attempt}" = 4 ]; then
              exit 1
            fi
            echo "push failed, retrying in $((2 ** attempt))s"
            sleep $((2 ** attempt))
          done

          # The force push already refreshed any open pull request for the
          # branch; only open a new one when there is none.
          open=$(gh pr list --head "${BRANCH}" --base "${GITHUB_REF_NAME}" \
            --state open --json number --jq '.[].number')
          if [ -n "$open" ]; then
            echo "updated existing pull request #${open}"
          else
            gh pr create --base "${GITHUB_REF_NAME}" --head "${BRANCH}" \
              --title "Published weekly compliance results" \
              --body "Weekly compliance run, published by [\`compliance.yml\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). The README block, badge and history are written by \`scripts/render-readme\`; nothing here is typed by hand."
          fi

          # Nothing above triggered a workflow run, so the pull request has no
          # `test` check and cannot merge. Ask tests.yml for one against the
          # results commit: the run reports `test` on that SHA exactly as a
          # pull_request-triggered run would, so the gate is still tests.yml
          # running the real suite rather than a status minted here.
          #
          # Not fatal — the results are pushed and the pull request is open by
          # this point, and both survive a failed dispatch. Closing and
          # reopening the pull request is the manual way to get the same run.
          if ! gh workflow run tests.yml --ref "${BRANCH}"; then
            echo "::warning::could not dispatch tests.yml against ${BRANCH};" \
              "the pull request will sit without a \`test\` check until one runs"
          fi

  # Watches for new upstream releases. This one is allowed to be red: it says
  # how far protoc-go is from a protoc release it does not claim to support
  # yet, which is a to-do list, not a compliance failure. Its results are
  # never published to the README.
  upstream-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Compare target against latest upstream release
        id: check
        run: |
          go build -o /tmp/protoc-go ./cmd/protoc-go/
          target=$(/tmp/protoc-go --version | awk '{print $2}')
          latest=$(curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/protocolbuffers/protobuf/releases/latest \
            | jq -r '.tag_name' | sed 's/^v//')

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$target" = "$latest" ]; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
            echo "Up to date with protoc $latest"
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
            echo "protoc $latest is out; protoc-go targets $target"
          fi

      - name: Install protoc ${{ steps.check.outputs.latest }}
        if: steps.check.outputs.drifted == 'true'
        run: |
          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v${{ steps.check.outputs.latest }}/protoc-${{ steps.check.outputs.latest }}-linux-x86_64.zip" -o protoc.zip
          unzip -q protoc.zip -d /tmp/protoc-install
          echo "/tmp/protoc-install/bin" >> "$GITHUB_PATH"

      - name: Measure the gap
        id: gap
        if: steps.check.outputs.drifted == 'true'
        continue-on-error: true
        run: scripts/test --summary --json results/drift.json

      - name: Report the gap
        if: steps.check.outputs.drifted == 'true'
        uses: actions/github-script@v7
        env:
          TARGET: ${{ steps.check.outputs.target }}
          LATEST: ${{ steps.check.outputs.latest }}
        with:
          script: |
            const fs = require('fs');
            const { TARGET, LATEST } = process.env;

            let detail = 'The suite did not complete against the new release.';
            try {
              const s = JSON.parse(fs.readFileSync('results/drift.json', 'utf8'));
              detail = `Against protoc ${LATEST}: **${s.pass}/${s.total}** comparisons still match` +
                (s.fail ? `, ${s.fail} now differ.` : '.');
              if (s.failing?.length) {
                detail += `\n\n<details><summary>First differences</summary>\n\n` +
                  s.failing.slice(0, 30).map(f => `- \`${f}\``).join('\n') +
                  `\n\n</details>`;
              }
            } catch (e) {}

            const title = `Upstream protoc ${LATEST} released (protoc-go targets ${TARGET})`;
            const body = [
              `C++ protoc \`${LATEST}\` is now the latest release; protoc-go targets \`${TARGET}\`.`,
              ``,
              detail,
              ``,
              `Bumping the target means updating the version string in \`compiler/cli/cli.go\`,`,
              `closing any differences above, and cutting a release.`,
              ``,
              `---`,
              `_Generated by [Claude Code](https://claude.ai/code)_`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-drift',
            });

            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['upstream-drift'],
              });
            }
